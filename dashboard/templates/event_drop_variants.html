{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static',path='event_drops.css') }}">
<div class="page-heading"><div><p class="eyebrow">Events / Event Drops / {{ campaign.name }}</p><h1>Drop Variants</h1></div><a class="button secondary" href="{{ url_for('event_drops_detail',campaign_id=campaign.id) }}">Back to campaign</a></div>
{% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
<div class="drop-editor-layout"><div>{% include '_event_drop_variants.html' %}</div>{% include '_event_drop_preview.html' %}</div>
<script src="{{ url_for('static',path='event_drops.js') }}" defer></script>
{% endblock %}
