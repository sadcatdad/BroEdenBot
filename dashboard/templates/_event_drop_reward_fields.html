{% set reward = variant if variant is defined else campaign %}
<label>Reward type<select name="reward_mode"><option value="static" {{ 'selected' if reward.reward_mode=='static' else '' }}>Fixed amount</option><option value="random" {{ 'selected' if reward.reward_mode=='random' else '' }}>Random amount per drop</option>{% if variant is defined %}<option value="empty" {{ 'selected' if reward.reward_mode=='empty' else '' }}>Empty / gotcha · 0 points</option>{% endif %}</select></label>
<div data-static-reward><label>Points per claim<input type="number" name="points" value="{{ reward.points }}" min="{{ 0 if variant is defined else 1 }}" max="1000000" required></label></div>
<div data-random-reward class="form-grid"><label>Minimum<input type="number" name="points_min" value="{{ reward.points_min if reward.points_min is not none else reward.points }}" min="1" max="1000000" required></label><label>Maximum<input type="number" name="points_max" value="{{ reward.points_max if reward.points_max is not none else reward.points }}" min="1" max="1000000" required></label><p class="muted">Inclusive range. Roll once when the drop is created; every member claiming that drop receives the same amount.</p></div>
