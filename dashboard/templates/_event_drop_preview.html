<aside class="drop-preview-wrap" id="drop-preview-config" data-campaign='{{ preview_campaign|tojson }}' data-variants='{{ preview_variants|tojson }}' data-editing-id="{{ variant.id if variant is defined and variant.id else '' }}">
  <p class="eyebrow">Discord preview</p>
  <label>Preview Variant<select id="drop-preview-variant">{% if variant is defined %}<option value="editing">Editing variant</option>{% endif %}<option value="standard">Campaign standard</option>{% for v in variants %}<option value="{{ v.id }}">{{ v.name }}{{ ' · Default' if v.is_default else '' }}{{ ' · Disabled' if not v.enabled else '' }}</option>{% endfor %}</select></label>
  <div class="drop-preview"><div class="drop-preview-author">BroEdenBot <small>APP</small></div><div id="drop-preview-embed"><img id="drop-preview-thumb" alt="Thumbnail preview" hidden><strong id="drop-preview-title"></strong><p id="drop-preview-body"></p><p id="drop-preview-reward" hidden></p><p id="drop-preview-rarity" hidden></p><p id="drop-preview-expires"></p><img id="drop-preview-image" alt="Campaign preview" hidden></div><button type="button" id="drop-preview-button" disabled></button></div><p class="muted"><small>Approximate preview. Discord renders markdown, custom emoji, and relative expiration. Saved drops keep their original appearance and reward.</small></p>
</aside>
